<meta charset="utf-8">
<title>The Gates of Kutha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Spectral:ital,wght@0,400;0,600;1,400&family=Courier+Prime:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Cuneiform&text=%F0%92%80%AD&display=swap">
<style>
/* Layout: a field notebook by lamplight. Story column left; survey plan and casebook right. Single dark theme: night over the tell, lapis and gold from the graves of Ur. */
:root {
  color-scheme: dark;
  --night: #0e121b;
  --panel: #141a26;
  --panel-hi: #1b2333;
  --plan: #101826;
  --line: #283246;
  --line-hi: #3d4961;
  --clay: #d6c7a6;
  --clay-hi: #efe3c8;
  --dust: #948e7f;
  --gold: #c9a44c;
  --lapis: #4467d4;
  --lapis-hi: #a3b6f0;
  --lapis-deep: #22336b;
  --carnelian: #b9472f;
  --ember: #e8927a;
  --verdigris: #72b49e;
  --f-display: 'IM Fell English SC', 'IM Fell English', Georgia, serif;
  --f-body: 'Spectral', Georgia, 'Times New Roman', serif;
  --f-mono: 'Courier Prime', 'Courier New', monospace;
  --f-cune: 'Noto Sans Cuneiform', serif;
}
html { background: var(--night); }
body {
  background: radial-gradient(120% 60% at 70% -10%, #18213a 0%, var(--night) 60%) var(--night);
  color: var(--clay); font-family: var(--f-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100vh;
}
.app { max-width: 1180px; margin: 0 auto; padding-block: 18px 48px; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 28px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: .45rem; font-family: var(--f-display); font-size: 1.4rem; color: var(--gold); letter-spacing: .03em; }
/* which build this is (build.js stamps it from package.json): set like the meters' labels, out of the way */
.build { font-family: var(--f-mono); font-size: .64rem; text-transform: uppercase; letter-spacing: .12em; color: var(--dust); margin-left: .2rem; }
.brand { flex-wrap: wrap; row-gap: 0; } /* (on the narrowest phones the build goes under the title) */
.dingir { font-family: var(--f-cune); color: var(--gold); font-style: normal; margin-right: .3em; }
.brand .dingir { margin: 0; font-size: 1.1em; }
.meters { display: flex; flex-wrap: wrap; gap: 8px 22px; }
body.no-game .meters { display: none; }
.meter { display: flex; align-items: center; gap: 8px; }
.m-label { font-family: var(--f-mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .12em; color: var(--dust); }
/* a meter's word (ui/scene.js, renderMeters): darker as things get worse */
.m-say { font-family: var(--f-body); font-style: italic; font-size: .98rem; color: var(--clay-hi); }
.m-say.m-1 { color: var(--clay); }
.m-say.m-2 { color: var(--gold); }
.m-say.m-3 { color: var(--ember); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 32px; margin-top: 24px; align-items: start; }
@media (max-width: 960px) { .layout { grid-template-columns: minmax(0, 1fr); } }

.stage { min-width: 0; }
.kicker { font-family: var(--f-mono); font-size: .76rem; text-transform: uppercase; letter-spacing: .14em; color: var(--gold); }
#sceneTitle { font-family: var(--f-display); font-weight: 400; font-size: clamp(2rem, 4.4vw, 2.9rem); line-height: 1.04; color: var(--clay-hi); margin: .25em 0 .15em; text-wrap: balance; }
.stage.is-intro #sceneTitle { font-size: clamp(2.6rem, 7vw, 4.2rem); }
.scene-sub { font-family: var(--f-mono); font-size: .8rem; color: var(--dust); margin-bottom: .4rem; }
.prose { margin-top: .9rem; }
.prose p { font-size: 1.08rem; line-height: 1.64; max-width: 64ch; margin: 0 0 .85em; }
.prose b { font-weight: 600; color: var(--clay-hi); }
.prose .dim, .dim { color: var(--dust); }
.prose p.dim { font-size: .97rem; }
.prose .omen { color: var(--lapis-hi); font-style: italic; }
.prose .lore { color: var(--clay-hi); }
.prose .lore b { color: var(--gold); }
.prose .horror { color: var(--ember); font-style: italic; }
.prose .warn { color: var(--gold); }
.prose .notice { font-style: italic; color: var(--clay-hi); }
.prose .event { font-family: var(--f-mono); font-size: .92rem; line-height: 1.5; border: 1px dashed var(--line-hi); padding: .7em .9em; max-width: 60ch; }
/* your own dreams (game/yourdreams.js) */
.prose .dream { font-style: italic; color: #c6b8e6; border-left: 2px solid rgba(198, 184, 230, .35); padding-left: .8em; }
/* the parts of a night and morning (game/night.js, resolveNight): when each thing happened */
.prose .part { font-family: var(--f-mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .14em; color: var(--dust); margin: 1.3em 0 .6em; padding-top: .6em; border-top: 1px solid var(--line); max-width: 64ch; }
.prose .part:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.prose .loss, .prose .gain { font-family: var(--f-mono); font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; margin-top: -.4em; }
.prose .loss { color: var(--ember); }
.prose .gain { color: var(--verdigris); }
.trace { font-weight: 600; color: var(--clay-hi); }
.diary { margin: 0 0 1em; padding: .8em 1em; max-width: 60ch; font-style: italic; font-size: 1.05rem; line-height: 1.75; color: var(--clay-hi);
  background: repeating-linear-gradient(to bottom, transparent 0 1.74em, rgba(163,182,240,.12) 1.74em calc(1.74em + 1px)); border: 1px solid var(--line); }
.namefield { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; margin: 1.2rem 0 .6rem; }
.namefield label { font-family: var(--f-mono); font-size: .76rem; text-transform: uppercase; letter-spacing: .12em; color: var(--dust); }
.namefield input { background: var(--panel); border: 1px solid var(--line-hi); color: var(--clay-hi); font: inherit; font-size: 1rem; padding: .45rem .7rem; width: min(100%, 260px); border-radius: 2px; }

.choices { display: grid; gap: 8px; margin-top: 1.3rem; max-width: 720px; }
.choice { display: grid; grid-template-columns: 1.6em minmax(0, 1fr); column-gap: .5rem; align-items: baseline; text-align: left; padding: .72rem .9rem; background: var(--panel); border: 1px solid var(--line); border-radius: 2px; color: var(--clay-hi); cursor: pointer; transition: border-color .15s, background-color .15s; }
.choice:hover, .choice:focus-visible { border-color: var(--gold); background: var(--panel-hi); }
.ch-key { font-family: var(--f-mono); font-size: .76rem; color: var(--dust); grid-row: span 2; }
.ch-label { font-weight: 600; font-size: 1.02rem; }
.ch-sub { grid-column: 2; font-family: var(--f-mono); font-size: .76rem; color: var(--dust); margin-top: 2px; }
.choice.danger .ch-label { color: var(--ember); }
.choice.minor { background: transparent; border-style: dashed; }
.choice.minor .ch-label { font-weight: 400; color: var(--clay); }
.stage.is-intro .choice { grid-template-columns: minmax(0, 1fr); padding: .9rem 1rem; }
.stage.is-intro .ch-label { font-family: var(--f-display); font-weight: 400; font-size: 1.35rem; color: var(--gold); }
.stage.is-intro .ch-sub { grid-column: 1; font-family: var(--f-body); font-size: .98rem; color: var(--clay); }
.ch-perk { font-family: var(--f-mono); font-size: .74rem; color: var(--dust); margin-top: .3rem; }
.stage.is-intro .ch-label.wire { font-family: var(--f-mono); font-size: 1.02rem; text-transform: uppercase; letter-spacing: .08em; }

.side { display: grid; gap: 20px; min-width: 0; }
.plan { margin: 0; background: var(--plan); border: 1px solid var(--line); border-radius: 2px; padding: 8px 8px 6px; }
.plan figcaption { font-family: var(--f-mono); font-size: .7rem; color: var(--dust); padding: 4px 2px 0; }
#map { display: block; width: 100%; height: auto; max-width: 100%; }
#map .grid { stroke: var(--line); stroke-width: .5; }
#map .gridlbl { fill: var(--dust); font-family: var(--f-mono); font-size: 8px; }
#map .canal { fill: none; stroke: var(--lapis); stroke-width: 6; opacity: .35; }
#map .canal2 { fill: none; stroke: var(--lapis-hi); stroke-width: .8; opacity: .45; }
#map .contour { fill: none; stroke: var(--clay); stroke-width: .7; }
#map .contour.outer { stroke-dasharray: 3 3; }
#map .feat { fill: none; stroke: var(--clay); stroke-width: .8; opacity: .7; }
#map .feat.cut { fill: var(--line-hi); }
#map .palm { stroke: var(--verdigris); stroke-width: .8; opacity: .65; fill: none; }
#map .north { fill: var(--clay); }
#map .scale { stroke: var(--clay); stroke-width: 1; fill: none; }
#map .loc .hit { fill: transparent; }
#map .loc .mk { fill: var(--plan); stroke: var(--gold); stroke-width: 1.5; transition: fill .15s; }
#map .loc.cur .mk { fill: var(--gold); }
#map .loclbl { fill: var(--clay-hi); font-family: var(--f-mono); font-size: 9.5px; font-weight: 700; paint-order: stroke; stroke: var(--plan); stroke-width: 3px; stroke-linejoin: round; }
#map.live .loc { cursor: pointer; }
#map.live .loc:hover .mk { fill: var(--gold); }
#map .loc:focus { outline: none; }
#map .loc:focus-visible .mk { stroke-width: 3.5; fill: var(--gold); }
#map .crime { stroke: var(--ember); stroke-width: 2; fill: none; }
#map .tok circle { fill: var(--lapis-deep); stroke: var(--clay); stroke-width: .6; }
#map .tok text { fill: var(--clay-hi); font-family: var(--f-mono); font-size: 6.5px; font-weight: 700; }

.casebook { background: var(--panel); border: 1px solid var(--line); border-radius: 2px; min-width: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tab { flex: 1; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--dust); font-family: var(--f-mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; padding: .75rem .25rem .6rem; cursor: pointer; }
.tab.on { color: var(--gold); border-bottom-color: var(--gold); }
#tabPanel { padding: 4px 14px 14px; max-height: 70vh; overflow-y: auto; }
@media (max-width: 960px) { #tabPanel { max-height: none; } }
.pad { padding-top: 10px; }
#tabPanel h4 { font-family: var(--f-mono); font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .14em; color: var(--gold); margin: 1rem 0 .4rem; }
.person { padding: .75rem 0; border-bottom: 1px solid var(--line); }
.person:last-child { border-bottom: 0; }
.p-head { display: flex; align-items: center; gap: .65rem; }
.p-id { flex: 1; min-width: 0; }
.p-name { font-weight: 600; color: var(--clay-hi); line-height: 1.25; }
.p-job { font-family: var(--f-mono); font-size: .7rem; color: var(--dust); }
.trust { white-space: nowrap; }
.mark { flex: none; font-family: var(--f-mono); font-size: .7rem; background: none; border: 1px solid var(--line-hi); color: var(--dust); padding: .28rem .55rem; border-radius: 2px; cursor: pointer; min-width: 6.2em; }
.mark.m-ally { color: var(--verdigris); border-color: var(--verdigris); }
.mark.m-foe { color: var(--ember); border-color: var(--carnelian); }
.s-taken .p-head, .s-dismissed .p-head, .s-taken .p-traits, .s-dismissed .p-traits { opacity: .5; }
.p-status { font-family: var(--f-mono); font-size: .72rem; color: var(--ember); margin: .3rem 0 0 calc(30px + .65rem); }
.p-traits, .p-chips { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: .4rem 0 0 calc(30px + .65rem); }
.p-chips { gap: 4px; }
.p-chips:empty { display: none; }
.tr { font-family: var(--f-mono); font-size: .72rem; color: var(--clay); }
.tr em { font-style: normal; color: var(--dust); }
.tr.unk { color: var(--line-hi); }
.chip { font-family: var(--f-mono); font-size: .68rem; padding: .08rem .4rem; border: 1px solid var(--line-hi); border-radius: 2px; color: var(--clay); white-space: nowrap; }
.p-chips .chip { white-space: normal; }
.chip.bad { border-color: var(--carnelian); color: var(--ember); }
.chip.good { border-color: var(--verdigris); color: var(--verdigris); }
.chip.warnc { border-color: var(--gold); color: var(--gold); }
.chip.dimc { color: var(--dust); }
.chip.strong { background: var(--carnelian); color: var(--clay-hi); }
.clue { padding: .55rem 0; border-bottom: 1px dashed var(--line); }
.c-top { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
.c-day { font-family: var(--f-mono); font-size: .7rem; color: var(--dust); }
.c-trace { font-style: italic; color: var(--clay-hi); margin: .15rem 0; }
.c-fit { font-family: var(--f-mono); font-size: .72rem; }
.tlog { list-style: none; margin: 0; padding: 0; }
.tlog li { padding: .35rem 0; font-size: .93rem; border-bottom: 1px dotted var(--line); }
.tlog b { color: var(--clay-hi); }
.god { padding: .5rem 0; border-bottom: 1px solid var(--line); }
.god ol { margin: .3rem 0 0 1.3rem; padding: 0; }
.god li { font-size: .92rem; margin: .15rem 0; }
.god li.unk { color: var(--line-hi); }
.item { padding: .55rem 0; border-bottom: 1px solid var(--line); }
.i-name { font-weight: 600; color: var(--clay-hi); }
.i-desc { font-size: .92rem; color: var(--dust); }
.mini { margin-top: .45rem; font-family: var(--f-mono); font-size: .72rem; background: none; border: 1px solid var(--gold); color: var(--gold); padding: .3rem .6rem; border-radius: 2px; cursor: pointer; }
.debrief { margin-top: 1.4rem; padding-top: 1rem; border-top: 1px solid var(--line); max-width: 720px; }
.debrief h3 { font-family: var(--f-display); font-weight: 400; font-size: 1.45rem; color: var(--gold); margin: 0 0 .5rem; }
.tablewrap { overflow-x: auto; margin: .6rem 0 1rem; }
.debrief table { border-collapse: collapse; width: 100%; font-size: .93rem; }
.debrief th { font-family: var(--f-mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--dust); text-align: left; font-weight: 400; }
.debrief td, .debrief th { padding: .42rem .55rem .42rem 0; border-bottom: 1px solid var(--line); }
.debrief th, .debrief td:first-child, .debrief td:nth-child(2) { white-space: nowrap; }
.debrief td.dim, .debrief td:nth-child(5) { min-width: 7em; }
.r-cult { color: var(--ember); font-weight: 600; }
.r-seer, .r-warden { color: var(--verdigris); }
.r-smuggler { color: var(--gold); }
.ok { color: var(--verdigris); }
.bad { color: var(--ember); }
.good { color: var(--verdigris); }
</style>
